name: Tauri release draft
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: tauri-release-draft
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh

jobs:
  windows-draft:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run version:check
      - name: Derive release tag and refuse published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "PICPORTAL_TAG=v$version" >> $env:GITHUB_ENV
          $existing = gh release view "v$version" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) {
            throw "v$version is already published; bump package.json and run version:sync"
          }
          exit 0
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm run test:desktop
      - run: npm run test:tauri-adapter
      - run: npm run test:batch
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run test:tauri-installer
        env:
          PICPORTAL_TEST_REPORT_DIR: ${{ runner.temp }}/tauri-smoke
      - run: npm run build:installer
      - name: Save build artifacts before creating draft
        uses: actions/upload-artifact@v4
        with:
          name: picportal-windows-x64
          path: src-tauri/target/release/bundle/nsis/PicPortal Tauri_*-setup.exe
          if-no-files-found: error
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Tauri 2 Windows x64 preview. Install separately as PicPortal Tauri and import Electron settings.

          This installer is unsigned. Automatic updates are not configured. Native OS drop acceptance remains deferred. Back up project .db files and image folders before use.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'picportal-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $existing = gh release view $env:PICPORTAL_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to modify a published release' }
            gh release edit $env:PICPORTAL_TAG --draft --prerelease --target '${{ github.sha }}' --notes-file $notesPath
          } else {
            gh release create $env:PICPORTAL_TAG --draft --prerelease --target '${{ github.sha }}' --title "PicPortal Tauri $env:PICPORTAL_TAG" --notes-file $notesPath
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter 'PicPortal Tauri_*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one distributable installer' }
          gh release upload $env:PICPORTAL_TAG $installer[0].FullName --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload isolated diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-diagnostics
          path: ${{ runner.temp }}/tauri-smoke
