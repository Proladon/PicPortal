[package]
name = "picportal"
version = "0.1.0"
description = "PicPortal desktop image management"
authors = ["Proladon"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "picportal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
walkdir = "2"
tempfile = "3"
same-file = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
